services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    volumes:
      - bot_data:/data
    environment:
      BOT_DB_PATH: /data/bot.db
    restart: unless-stopped
    networks:
      - leniser-wpp

volumes:
  bot_data:

networks:
  leniser-wpp:
    driver: bridge
